<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=PT+Sans:wght@400;700&display=swap">
<style>
/* Layout: full-bleed game scene, controls docked in a slim bar beneath; dark-first single look (game screen). */
:root{
  --ink:#0d1114; --panel:#161c20; --line:#2b353b; --fg:#e7dcc6; --muted:#9a9282;
  --ember:#e0a04a; --blood:#c4483e; --moss:#7e9a5a;
  --display:"Cormorant Garamond",Georgia,serif; --body:"PT Sans",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--ink);color:var(--fg);font-family:var(--body);display:flex;flex-direction:column}
.stage{position:relative;flex:1;min-height:300px;overflow:hidden}
canvas{display:block;width:100%;height:100%;touch-action:none}
.title{position:absolute;top:12px;left:max(16px,env(safe-area-inset-left,0px));pointer-events:none}
.title h1{font-family:var(--display);font-size:clamp(22px,4vw,34px);margin:0;letter-spacing:.01em;text-shadow:0 2px 8px #000}
.title p{margin:2px 0 0;font-size:13px;color:var(--muted);text-shadow:0 1px 4px #000}
.hp{position:absolute;top:14px;right:max(16px,env(safe-area-inset-right,0px));width:150px;pointer-events:none}
.hp .lbl{font-size:12px;color:var(--muted);margin-bottom:4px;text-align:right}
.hp .bar{height:10px;background:#000;border:2px solid #4a5560;image-rendering:pixelated}
.hp .fill{height:100%;background:var(--blood);transition:width .3s}
.float{position:absolute;pointer-events:none;font-family:var(--display);font-weight:700;font-size:28px;text-shadow:0 2px 0 #000,0 0 12px #000;transform:translate(-50%,-50%);transition:transform 900ms ease-out,opacity 900ms ease-in}
.dice{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);background:rgba(13,17,20,.85);border:1px solid var(--line);padding:8px 14px;font-size:14px;border-radius:4px;max-width:calc(100% - 32px);text-align:center}
.dice[hidden]{display:none}
.dice b{color:var(--ember);font-family:var(--display);font-size:20px}
.bar-ui{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--panel);border-top:1px solid var(--line)}
button{font:inherit;font-size:14px;color:var(--fg);background:#232b30;border:1px solid var(--line);padding:9px 14px;border-radius:3px;cursor:pointer}
button:hover{border-color:var(--ember)}
button:focus-visible{outline:2px solid var(--ember);outline-offset:2px}
button[aria-pressed="true"]{background:#3a2c1a;border-color:var(--ember);color:#f3d9a8}
.hint{font-size:12.5px;color:var(--muted);flex:1 1 220px;min-width:0}
.vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 55%,transparent 45%,rgba(5,8,10,.55) 100%)}

.palm{position:absolute;bottom:-18px;width:132px;height:132px;image-rendering:pixelated;pointer-events:auto;cursor:pointer;filter:drop-shadow(0 4px 0 #0008);transition:transform .15s}
.palm.l{left:max(4px,env(safe-area-inset-left,0px));transform:rotate(-8deg)}
.palm.r{right:max(4px,env(safe-area-inset-right,0px));transform:rotate(8deg)}
.palm:active{transform:scale(.94)}
@media (max-width:600px){.palm{width:80px;height:90px}}

.palm{z-index:6}
.palm.l.open{transform:rotate(-2deg) translateY(-18px)}
.palm.r.open{transform:rotate(2deg) translateY(-18px)}
.inv{position:absolute;bottom:96px;z-index:5;width:212px;padding:10px 10px 12px;background:#1d1611;font-family:"Pixelify Sans","Courier New",monospace;color:#f0e2c2;
  box-shadow:0 0 0 3px #6a4a2c,0 0 0 6px #120c08,0 0 0 7px #b8923e,0 10px 0 6px #0008;image-rendering:pixelated;
  transform:translateY(40px) scaleY(.2);transform-origin:bottom;opacity:0;pointer-events:none;transition:transform .22s cubic-bezier(.2,1.4,.4,1),opacity .15s}
.inv.l{left:max(28px,env(safe-area-inset-left,0px))}.inv.r{right:max(28px,env(safe-area-inset-right,0px))}
.inv.open{transform:none;opacity:1;pointer-events:auto}
.inv::after{content:"";position:absolute;bottom:-15px;width:16px;height:9px;background:#b8923e;clip-path:polygon(0 0,100% 0,50% 100%)}
.inv.l::after{left:42px}.inv.r::after{right:42px}
.inv h4{margin:0 0 8px;font-size:14px;color:#f2c14e;text-shadow:2px 2px 0 #000;display:flex;justify-content:space-between}
.inv h4 small{color:#a8987a;font-size:11px}
.inv .grid{display:grid;grid-template-columns:repeat(4,44px);gap:6px}
.inv button{width:44px;height:44px;border:0;padding:0;background:#0e0a07;box-shadow:inset 0 0 0 2px #4a3522,inset 0 0 0 4px #0e0a07;cursor:pointer;position:relative;
  transform:scale(.6);opacity:0;transition:transform .18s,opacity .18s}
.inv.open button{transform:none;opacity:1}
.inv button canvas{width:28px;height:28px;image-rendering:pixelated;display:block;margin:auto}
.inv button.on{box-shadow:inset 0 0 0 2px #f2c14e,inset 0 0 0 4px #0e0a07,0 0 10px #f2c14e66}
.inv button:disabled{opacity:.3!important;cursor:not-allowed}
.inv button small{position:absolute;right:3px;bottom:1px;font-size:10px;color:#f2c14e}
.inv .name{margin-top:8px;font-size:12px;color:#d8c8a6;min-height:1.2em}
.held{position:absolute;bottom:70px;z-index:7;width:34px;height:34px;image-rendering:pixelated;filter:drop-shadow(0 2px 0 #000);pointer-events:none;transition:transform .2s}
.held{z-index:7;width:46px;height:46px;padding:7px;bottom:40px!important;top:auto!important;border-radius:50%;background:#1d1611;
  box-shadow:0 0 0 3px #6a4a2c,0 0 0 5px #120c08,0 0 0 6px #b8923e,0 4px 0 5px #0008;transform:none!important;transition:transform .18s,opacity .18s!important}
.held.l{left:max(98px,env(safe-area-inset-left,0px))!important}.held.r{right:max(98px,env(safe-area-inset-right,0px))!important;left:auto!important}
.held.empty{opacity:0;transform:scale(.6)!important}
.held.pop{animation:pop .25s}
@keyframes pop{0%{transform:scale(.5)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
@media (max-width:600px){.held{width:36px;height:36px;padding:5px;bottom:76px!important}.held.l{left:64px!important}.held.r{right:64px!important}.inv{bottom:70px;width:184px}.inv .grid{grid-template-columns:repeat(4,38px)}.inv button{width:38px;height:38px}.held{bottom:66px}.held.l{left:48px}.held.r{right:48px}}
@media (prefers-reduced-motion:reduce){.inv,.inv button,.palm,.held{transition:none}}
.zone{position:absolute;left:50%;top:16%;transform:translateX(-50%);font-family:var(--display);font-size:clamp(20px,3.4vw,30px);color:#f3e2bd;text-shadow:0 2px 8px #000;opacity:0;pointer-events:none}
.zone.show{animation:zone 2.6s ease}
@keyframes zone{0%{opacity:0;transform:translate(-50%,8px)}15%,70%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.zone.show{animation:none;opacity:1}}
.fade{position:absolute;inset:0;background:#05070a;opacity:0;pointer-events:none;transition:opacity .25s;z-index:8}.fade.on{opacity:1}
.talk{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);width:min(440px,calc(100% - 340px));min-width:240px;z-index:9;background:#1d1611;color:#f0e2c2;padding:12px 14px;
  font-family:"Pixelify Sans","Courier New",monospace;box-shadow:inset 0 0 0 2px #b8923e,inset 0 0 0 4px #1d1611,inset 0 0 0 6px #4a3522,0 6px 0 #0008}
.talk b{color:#f2c14e;font-size:14px;text-shadow:2px 2px 0 #000}.talk p{margin:6px 0 10px;font-size:14px;line-height:1.35}
.talk div{display:flex;gap:8px;flex-wrap:wrap}.talk button{font:inherit;font-size:13px;color:#f0e2c2;background:#3a2a1a;border:0;padding:8px 12px;min-height:36px;box-shadow:inset 0 0 0 2px #b8923e;cursor:pointer}
.talk button:last-child{background:#0e0a07;box-shadow:inset 0 0 0 2px #4a3522}
.quest{position:absolute;top:84px;left:max(16px,env(safe-area-inset-left,0px));max-width:300px;font-family:"Pixelify Sans","Courier New",monospace;font-size:12px;color:#e8d8b4;pointer-events:none;text-shadow:1px 1px 0 #000}
.quest div{background:#1d1611cc;padding:5px 8px;margin-bottom:4px;box-shadow:inset 3px 0 0 #f2c14e}.quest div.done{box-shadow:inset 3px 0 0 #7fe08a;color:#bfe8b0}
[hidden]{display:none!important}
.hp,.title,.quest{text-shadow:0 1px 2px #000,0 0 6px #000}
#sneak.on,#stone.on{box-shadow:inset 0 0 0 2px #7fd0ff;color:#cfeeff}
.cstat{font-size:12px;color:#d8c8a6}
.order{position:absolute;top:10px;left:50%;transform:translateX(-50%);display:flex;gap:4px;z-index:6;font-family:"Pixelify Sans","Courier New",monospace;font-size:11px;max-width:calc(100% - 360px);flex-wrap:wrap;justify-content:center}
.order span{background:#1d1611e6;color:#e8d8b4;padding:4px 7px;box-shadow:inset 0 0 0 2px #4a3522}.order .round{color:#f2c14e;box-shadow:none;background:#0e0a07cc}
.order .now{box-shadow:inset 0 0 0 2px #f2c14e;color:#fff;transform:translateY(2px)}.order .me{color:#9fe0ff}
.roll{position:absolute;left:50%;top:30%;transform:translateX(-50%);z-index:8;background:#1d1611f0;color:#f0e2c2;padding:10px 16px;text-align:center;min-width:240px;pointer-events:none;
  font-family:"Pixelify Sans","Courier New",monospace;box-shadow:inset 0 0 0 2px #b8923e,inset 0 0 0 4px #1d1611,inset 0 0 0 6px #4a3522,0 6px 0 #0008}
.roll small{display:block;color:#f2c14e;font-size:13px}.roll .dz{display:flex;gap:10px;justify-content:center;margin:8px 0}
.roll .d20{width:46px;height:46px;display:grid;place-items:center;font-size:22px;font-weight:700;color:#fff;background:#3a2a1a;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.roll .d20.spin{animation:spin .12s linear infinite}.roll .d20.ok{background:#3c6a34}.roll .d20.no{background:#7a2620}.roll .d20.crit{background:#c8962a;color:#1d1611}.roll .d20.drop{opacity:.35}
@keyframes spin{50%{transform:rotate(30deg) scale(.9)}}
.roll p{margin:2px 0;font-size:13px}.roll b.ok{color:#8fe07a}.roll b.no{color:#ff7d6e}.roll .dmg{color:#ffd27a}
.amenu{position:absolute;z-index:9;background:#1d1611;padding:8px;display:flex;flex-direction:column;gap:5px;min-width:190px;font-family:"Pixelify Sans","Courier New",monospace;
  box-shadow:inset 0 0 0 2px #b8923e,inset 0 0 0 4px #1d1611,inset 0 0 0 6px #4a3522,0 6px 0 #0008}
.amenu>b{font-size:12px;color:#f2c14e;padding:2px 4px}.amenu button{display:flex;justify-content:space-between;gap:12px;font:inherit;font-size:13px;color:#f0e2c2;background:#3a2a1a;border:0;padding:8px 10px;min-height:38px;box-shadow:inset 0 0 0 2px #6a4a2a;cursor:pointer;text-align:left}
.amenu button small{color:#8fe07a;font-size:12px}.amenu button:disabled{opacity:.45;cursor:not-allowed}.amenu button:disabled small{color:#a8987a}
@media (prefers-reduced-motion:reduce){.roll .d20.spin{animation:none}}
@media (max-height:440px){.roll{top:22%;padding:6px 12px}.roll .d20{width:36px;height:36px;font-size:17px}.order{top:6px;max-width:calc(100% - 300px)}.cstat{font-size:11px}.title p,.bar-ui .hint{display:none}.title h1{font-size:20px}.bar-ui{padding:6px 10px!important;gap:8px}.bar-ui button{min-height:36px;padding:6px 14px!important}.quest{top:44px}.palm{width:88px!important;height:88px!important;bottom:-10px!important}.inv{bottom:60px!important;width:172px!important;padding:8px!important}.inv .grid{grid-template-columns:repeat(4,34px)!important;gap:5px!important}.inv button{width:34px!important;height:34px!important}.inv h4{font-size:12px!important;margin-bottom:6px!important}.held{width:34px!important;height:34px!important;padding:5px!important;bottom:26px!important}.held.l{left:66px!important}.held.r{right:66px!important}.hp{width:120px!important}}
@media (max-width:700px){.talk{width:calc(100% - 32px);bottom:auto;top:70px}}
.menubtn{position:absolute;top:10px;left:max(10px,env(safe-area-inset-left,0px));z-index:7;width:40px;height:40px;border:0;background:#1d1611e6;color:#f0e2c2;cursor:pointer;
  box-shadow:inset 0 0 0 2px #b8923e,inset 0 0 0 4px #1d1611,inset 0 0 0 6px #4a3522;display:grid;place-items:center}
.title{left:max(60px,calc(env(safe-area-inset-left,0px) + 60px))!important}
.cstat{position:absolute;top:44px;left:50%;transform:translateX(-50%);z-index:6;font-family:"Pixelify Sans","Courier New",monospace;font-size:12px;color:#e8d8b4;background:#1d1611cc;padding:4px 10px;text-align:center;pointer-events:none;text-shadow:1px 1px 0 #000}
.cstat b{color:#8fe07a}.cstat s{color:#a8987a}.cstat small{color:#a8987a;font-size:10px}
/* dice: one slim strip at the top, under the turn order */
.roll{position:absolute!important;left:50%!important;top:auto!important;bottom:14px;transform:translateX(-50%)!important;min-width:0!important;padding:5px 10px!important;display:flex;align-items:center;gap:6px;white-space:nowrap;max-width:calc(100% - 300px);overflow:hidden}
.roll .lbl{font-size:11px;color:#f2c14e;overflow:hidden;text-overflow:ellipsis}.roll .res,.roll .dmg{font-size:12px}.roll .dmg{color:#ffd27a}
.roll .d20{width:26px!important;height:26px!important;font-size:13px!important;flex:none}
/* action wheel */
.wheel{position:absolute;z-index:9;width:0;height:0}
.wheel .wtitle{position:absolute;left:0;top:-122px;transform:translateX(-50%);white-space:nowrap;font-family:"Pixelify Sans","Courier New",monospace;font-size:12px;color:#f2c14e;background:#1d1611e6;padding:3px 8px;text-shadow:1px 1px 0 #000}
.wbtn{position:absolute;width:0;height:0;border:0;padding:0;background:none;cursor:pointer;font-family:"Pixelify Sans","Courier New",monospace;opacity:0;transform:scale(.4);transition:opacity .16s,transform .2s cubic-bezier(.2,1.5,.4,1)}
.wheel.open .wbtn{opacity:1;transform:none}
.wbtn .ring{position:absolute;left:-23px;top:-23px;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:#f0e2c2;background:radial-gradient(circle at 40% 35%,#4a3522,#1d1611);box-shadow:0 0 0 2px #b8923e,0 0 0 4px #1d1611,0 3px 0 4px #0008}
.wbtn .ring img{width:30px;height:30px;image-rendering:pixelated}
.wbtn .wl,.wbtn .ws{position:absolute;left:0;transform:translateX(-50%);white-space:nowrap;text-shadow:1px 1px 0 #000,0 0 4px #000;pointer-events:none}
.wbtn .wl{top:26px;font-size:11px;color:#f0e2c2}.wbtn .ws{top:39px;font-size:10px;color:#8fe07a}
.wbtn:disabled{cursor:not-allowed}.wbtn:disabled .ring{filter:grayscale(1) brightness(.6)}.wbtn:disabled .ws{color:#a8987a}
.wbtn:not(:disabled):active .ring{transform:scale(.9)}
.wclose{position:absolute;left:-14px;top:-14px;width:28px;height:28px;border-radius:50%;border:0;background:#0e0a07cc;color:#a8987a;display:grid;place-items:center;cursor:pointer}
.wclose svg{width:12px;height:12px}
/* menus */
.screen{position:absolute;inset:0;z-index:20;display:grid;place-items:center;font-family:"Pixelify Sans","Courier New",monospace;color:#f0e2c2}
.screen.main,.screen.pause{background:radial-gradient(ellipse at 50% 40%,#0d1418aa,#05070aee)}
.mm{display:flex;flex-direction:column;gap:10px;min-width:240px;align-items:stretch;text-align:center}
.mm h2{margin:0;font-family:var(--display);font-size:clamp(30px,6vw,52px);color:#f3e2bd;text-shadow:0 3px 0 #000,0 0 18px #000;font-weight:700}
.mm p{margin:-6px 0 10px;color:#c8b48a;font-size:14px}
.mm button,.edbtns button{font:inherit;font-size:16px;color:#f0e2c2;background:#2a1e14;border:0;padding:12px 18px;min-height:46px;cursor:pointer;box-shadow:inset 0 0 0 2px #b8923e,inset 0 0 0 4px #2a1e14,inset 0 0 0 6px #4a3522,0 4px 0 #0008}
.mm button:active,.edbtns button:active{transform:translateY(2px)}
.mset{display:flex;flex-direction:column}
.sheet{display:flex;flex-direction:column;gap:3px;background:#1d1611e6;padding:10px 14px;font-size:13px;text-align:left;box-shadow:inset 0 0 0 2px #4a3522;max-width:360px}
.sheet b{color:#f2c14e;font-size:15px}.sheet small{color:#a8987a;margin-top:4px}
.screen.editor{background:#0b0e10;place-items:stretch}
.ed{display:flex;height:100%;padding:12px max(12px,env(safe-area-inset-right,0px)) 12px max(12px,env(safe-area-inset-left,0px));gap:14px;box-sizing:border-box}
.edl{flex:1;min-width:0;background:radial-gradient(ellipse at 50% 60%,#2a2016,#0b0e10 70%);box-shadow:inset 0 0 0 2px #4a3522}
.edl canvas{width:100%;height:100%;display:block}
.edr{width:min(360px,52%);overflow-y:auto;padding-top:6px;display:flex;flex-direction:column;gap:6px;padding-right:4px}
.edr h2{margin:0;font-family:var(--display);font-size:24px;color:#f3e2bd}
.nm{display:flex;flex-direction:column;font-size:12px;color:#c8b48a;gap:3px}
.nm input{font:inherit;font-size:16px;color:#f0e2c2;background:#1d1611;border:0;padding:8px 10px;box-shadow:inset 0 0 0 2px #4a3522}
.lab{font-size:12px;color:#c8b48a;margin-top:2px}
.cls-row{display:flex;gap:6px}.cls{flex:1;font:inherit;color:#f0e2c2;background:#1d1611;border:0;padding:8px 4px;cursor:pointer;display:flex;flex-direction:column;gap:2px;box-shadow:inset 0 0 0 2px #4a3522}
.cls b{font-size:14px}.cls small{font-size:10px;color:#a8987a}.cls.on{box-shadow:inset 0 0 0 2px #f2c14e;background:#3a2a1a}
.about{margin:0;font-size:12px;color:#d8c8a6;line-height:1.35}
.sw-row{display:flex;gap:8px;flex-wrap:wrap}.sw{width:34px;height:34px;border:0;cursor:pointer;box-shadow:inset 0 0 0 2px #0008}.sw.on{box-shadow:0 0 0 2px #f2c14e,inset 0 0 0 2px #0008}
.edbtns{display:flex;gap:8px;margin-top:6px}.edbtns button{flex:1}.edbtns .go{background:#3c4a24}
@media (max-aspect-ratio:1/1){.ed{flex-direction:column}.edl{flex:none;height:38%}.edr{width:auto;flex:1}.cls b{font-size:13px}}
@media (max-height:440px){.edr h2{font-size:18px}.mm{gap:6px}.mm button{min-height:38px;padding:8px 14px;font-size:14px}.mm h2{font-size:30px}.cstat{top:34px}.roll{bottom:10px}}
@media (prefers-reduced-motion:reduce){.wbtn{transition:none}}
/* ---------- slots: hands, bag, chest ---------- */
.inv{width:auto!important}
.inv h4 small{font-size:9px!important;max-width:120px;text-align:right;line-height:1.1}
.handrow{display:flex;align-items:center;gap:8px;margin-bottom:6px}.handrow .hl{font-size:11px;color:#a8987a}
.slot{position:relative;width:44px;height:44px;border:0;padding:0;background:#0e0a07;cursor:pointer;touch-action:none;
  box-shadow:inset 0 0 0 2px #4a3522,inset 0 0 0 4px #0e0a07;transition:transform .12s}
.slot canvas{width:28px;height:28px;image-rendering:pixelated;display:block;margin:auto;pointer-events:none}

.slot:not(.empty):active{transform:scale(.92)}

  box-shadow:inset 0 0 0 2px #b8923e,inset 0 0 0 4px #1d1611,inset 0 0 0 6px #4a3522,0 8px 0 #0008;animation:chestIn .25s cubic-bezier(.2,1.4,.4,1);max-width:calc(100% - 24px)}

/* ---------- "you got" card ---------- */
.gotcard{position:absolute;left:50%;top:26%;z-index:14;transform:translate(-50%,0) scale(.6);opacity:0;background:#1d1611f2;padding:10px 16px;min-width:180px;font-family:"Pixelify Sans","Courier New",monospace;color:#f0e2c2;

/* ---------- palm gestures ---------- */
@keyframes hold{0%,100%{translate:0 0}50%{translate:0 -3px}}
.palm.holding{animation:hold 2.6s ease-in-out infinite}
.palm.r.holding{animation-delay:-1.3s}

.palm.peek{transform:translate(-40px,-60px) rotate(-30deg)!important;transition:transform .3s}
.palm.reach{transform:translateY(-40px)!important;transition:transform .25s}

.held{transition:transform .2s,opacity .2s}

// ---------- seeded random ----------
let seed=7;const rnd=()=>{seed=(seed*16807)%2147483647;return (seed-1)/2147483646};
const pick=a=>a[Math.floor(rnd()*a.length)];

// ---------- original pixel textures, drawn in code ----------
function tex(size,paint){const c=document.createElement('canvas');c.width=c.height=size;const g=c.getContext('2d');paint(g,size);
  const t=new THREE.CanvasTexture(c);t.magFilter=THREE.NearestFilter;t.minFilter=THREE.NearestFilter;t.generateMipmaps=false;return t}
const px=(g,x,y,col,w=1,h=1)=>{g.fillStyle=col;g.fillRect(x,y,w,h)};
const noise=(g,s,cols,density=1)=>{for(let y=0;y<s;y++)for(let x=0;x<s;x++)if(rnd()<density)px(g,x,y,pick(cols))};

function planks(variant){return tex(32,(g,s)=>{
  const tones=[['#5b4636','#4f3d2f','#66503e'],['#574334','#4a392c','#61493a'],['#5e4838','#523f31','#6a5241'],['#544032','#47372b','#5f4a3a']];
  for(let p=0;p<4;p++){const t=tones[(p+variant)%4];for(let y=p*8;y<p*8+8;y++)for(let x=0;x<s;x++)px(g,x,y,pick(t));
    for(let k=0;k<3;k++){const y=p*8+1+Math.floor(rnd()*6),x=Math.floor(rnd()*24);px(g,x,y,'#7a604b',4+Math.floor(rnd()*6),1)}
    px(g,0,p*8+7,'#2a1f18',s,1);const j=(p*11+variant*7)%28+2;px(g,j,p*8,'#2a1f18',1,7)}
  for(let p=0;p<4;p++)for(const x of [2,29])if(rnd()<.8){px(g,x,p*8+3,'#8a8a8e');px(g,x,p*8+4,'#2a2622');}
  for(let i=0;i<6;i++){const y=Math.floor(rnd()*s),x=Math.floor(rnd()*20);px(g,x,y,'#3f3026',6+Math.floor(rnd()*6),1);}
  if(variant===2){for(let y=10;y<22;y++){const w=Math.max(0,8-Math.abs(y-16)*1.4+rnd()*2);px(g,20,y,'#1a1310',Math.floor(w),1)}}
  if(variant===3){for(let y=2;y<12;y++)px(g,4+(y>>1),y,'#3b2c22',2,1)}
  for(let i=0;i<14;i++)px(g,Math.floor(rnd()*s),Math.floor(rnd()*s),pick(['#4d6b34','#5d7d3c','#3f5a2c']))})}
function stoneFloor(){return tex(32,(g,s)=>{px(g,0,0,'#2c2f31',s,s);
  const blocks=[[0,0,13,9],[14,0,18,9],[0,10,8,10],[9,10,13,10],[23,10,9,10],[0,21,16,11],[17,21,15,11]];
  for(const[x,y,w,h]of blocks){const b=pick([['#6d6a62','#64625b','#77736a'],['#5f6260','#575a59','#6a6c69'],['#6b665c','#625d54','#746f64']]);
    for(let yy=y;yy<y+h-1;yy++)for(let xx=x;xx<x+w-1;xx++)px(g,xx,yy,pick(b));px(g,x,y,'#8a857a',w-1,1);px(g,x,y+h-2,'#46443f',w-1,1)}
  for(let i=0;i<18;i++)px(g,Math.floor(rnd()*s),Math.floor(rnd()*s),pick(['#4d6b34','#56763a']))})}
// grass: dithered base, darker clumps, blades catching light, rare clover and pebbles
function grass(){return tex(32,(g,s)=>{noise(g,s,['#2f4a26','#344f29','#2c4624','#36522b']);
  for(let i=0;i<9;i++){const cx=Math.floor(rnd()*s),cy=Math.floor(rnd()*s),r=2+Math.floor(rnd()*3);for(let y=-r;y<=r;y++)for(let x=-r;x<=r;x++)if(x*x+y*y<=r*r&&rnd()<.75)px(g,(cx+x+s)%s,(cy+y+s)%s,pick(['#28401f','#2a4321','#253c1d']));}
  for(let i=0;i<55;i++){const x=Math.floor(rnd()*s),y=Math.floor(rnd()*s),h=1+Math.floor(rnd()*3);for(let k=0;k<h;k++)px(g,x,(y+k)%s,k===0?'#5d8240':'#46683a');}
  for(let i=0;i<5;i++){const x=Math.floor(rnd()*30),y=Math.floor(rnd()*30);px(g,x,y,'#4f7a3a',2,2);px(g,x,y,'#6a9a4a');}
  for(let i=0;i<3;i++){const x=Math.floor(rnd()*31),y=Math.floor(rnd()*31);px(g,x,y,'#7a7468',2,1);px(g,x,y+1,'#3a3a32',2,1);}})}
// packed earth: two-tone ruts, shaded pebbles, a few roots
function dirt(){return tex(32,(g,s)=>{noise(g,s,['#4a3b2c','#45372a','#504031','#41342a']);
  for(let y=0;y<s;y+=8){const o=Math.floor(rnd()*4);for(let x=0;x<s;x++)if(rnd()<.6)px(g,x,(y+o+Math.floor(Math.sin(x*.4)*1.5)+s)%s,'#3a2e22');}
  for(let i=0;i<16;i++){const x=Math.floor(rnd()*30),y=Math.floor(rnd()*30),c=pick(['#7a6c58','#6b5d4c','#857560']);px(g,x,y,c,2,1);px(g,x,y+1,'#2e251c',2,1);px(g,x,y,'#9a8a72');}
  for(let i=0;i<2;i++){let x=Math.floor(rnd()*s),y=Math.floor(rnd()*s);for(let k=0;k<7;k++){px(g,x,y,'#5a3e28');x=(x+1)%s;if(rnd()<.4)y=(y+1)%s;}}})}
// cobbles: rounded stones with lit tops, dark mortar, moss in the seams
function cobble(){return tex(32,(g,s)=>{px(g,0,0,'#29241e',s,s);
  for(let y=0;y<s;y+=6)for(let x=((y/6)%2)*3-3;x<s;x+=7){const w=5+Math.floor(rnd()*2),c=pick([['#605a50','#6e685c','#4c4840'],['#686354','#787260','#525046'],['#57544c','#66625a','#45433d']]);

  if(S.done()){TUT.step++;sfx('pickup');if(TUT.step===6)spawnRat();if(!tutOn())return endTutorial(false);questUI();toast('Готово! Дальше: '+TSTEPS[TUT.step].t,3000);}}
function endTutorial(skipped){TUT.step=TSTEPS.length;coachEl.hidden=true;if(skipped&&rat&&!rat.dead){rat.dead=true;rat.o.visible=false;}questUI();
  banner(skipped?'Обучение пропущено':'Обучение пройдено');if(!skipped)note('Дальше — сами','Брам расскажет о беде острова. У жителей есть и простые просьбы — поговорите с ними.');}
function spawnRat(){if(rat&&!rat.dead)return;const R=ROOMS[4];const [x,z]=nearFree(R.ox+4,R.oz+4,3);
  rat=foe('wolf',x,z,{name:'Крыса',hp:5,max:5,ac:10,atk:2,dmg:3,dmgB:0,speed:4,perc:8,wander:0,temp:true,atkName:'Укус'});rat.o.scale.setScalar(.55);addBar(rat);}

function herbTalk(n){const q=Q.herb,have=window.handsCount('herb');
  if(q.state===0)return say(n,'Ты бледен, путник. Принеси мне три пучка мяты с луга за хижиной — сварю тебе отвар покрепче.',[['Принесу',()=>{q.state=1;questFocus=q;questUI();}]]);
  if(q.state===1&&have<3)return say(n,'Мне нужно три пучка, у тебя '+have+'. Мята растёт на лугу к югу, у самой воды.');
  if(q.state===1){for(let i=0;i<3;i++)window.handsConsume('herb');q.state=3;window.handsGive([['potion',2]],'Награда');questUI();return say(n,'Чудесная мята! Держи два отвара. Пей, когда будет худо — нажми на себя и выбери «Зелье».');}

  const T=questTarget();if(T&&!T.inRoom||T&&T.inRoom){let tx=T.x-H0.x,tz=T.z-H0.z;const d=Math.hypot(tx,tz);if(d>R-1){tx=tx/d*(R-1);tz=tz/d*(R-1);}
    mg.fillStyle='#ff5a4a';mg.beginPath();mg.arc((tx+R+.5)*k,(tz+R+.5)*k,4,0,7);mg.fill();}
  mg.fillStyle='#f2c14e';mg.strokeStyle='#000';mg.beginPath();mg.arc((R+.5)*k,(R+.5)*k,4,0,7);mg.fill();mg.stroke();}

     if(k<=0)return undo('Больше не помещается: '+ITEMS[A.id].n+'.');B.n+=k;A.n-=k;if(!A.n)S(ak)[ai]=null;return true;}
   if(!carry(ak)&&carry(bk)){const lim=room(A.id);if(lim<=0)return undo('Больше не унести: '+ITEMS[A.id].n+' (предел '+ITEMS[A.id].max+').');
     if(A.n>lim){if(B)return undo('Сначала освободите ячейку.');S(bk)[bi]={id:A.id,n:lim};A.n-=lim;}else{S(ak)[ai]=B;S(bk)[bi]=A;}}
   else{S(ak)[ai]=B;S(bk)[bi]=A;if(carry(ak)&&!carry(bk)&&B&&carried(B.id)>ITEMS[B.id].max)return undo('Больше не унести: '+ITEMS[B.id].n+'.');}
   // a two-handed item and something in the other hand can't coexist: the older one goes to the bag
   for(const s of ['L','R']){const o=s==='L'?'R':'L';if(isTwo(hand(s))&&hand(o)){const out=bk===s?o:s,e=firstEmpty('bag');if(e<0)return undo('Нужно место в сумке.');C.bag[e]=C[out][0];C[out][0]=null;}}
   return true;}
 const firstEmpty=k=>S(k).findIndex(x=>!x);
 let say2=t=>window.toast?window.toast(t):0;
 function add(id,n){let left=Math.min(n,room(id));const got=left;
   for(const k of ['bag','L','R'])for(const x of S(k))if(x&&x.id===id&&left>0){const k2=Math.min(left,ITEMS[id].max-x.n);x.n+=k2;left-=k2;}
   while(left>0){let e=firstEmpty('bag');let k='bag';if(e<0){if(!hand('R')&&!isTwo(hand('L'))&&!ITEMS[id].two){k='R';e=0;}else if(!hand('L')&&!isTwo(hand('R'))&&!ITEMS[id].two){k='L';e=0;}else break;}
     const k2=Math.min(left,ITEMS[id].max);S(k)[e]={id,n:k2};left-=k2;}
   return got-left;}
 function take1(id){for(const k of ['bag','L','R'])for(let i=0;i<S(k).length;i++){const x=S(k)[i];if(x&&x.id===id){x.n--;if(!x.n)S(k)[i]=null;return true;}}return false;}

 // ---------- drawing slots ----------
 function slotEl(k,i){const x=S(k)[i],b=document.createElement('button');b.className='slot'+(sel&&sel.k===k&&sel.i===i?' sel':'')+(x?'':' empty');b.dataset.k=k;b.dataset.i=i;
   if(x){b.append(icon(document.createElement('canvas'),x.id));if(x.n>1){const c=document.createElement('small');c.textContent=x.n;b.append(c);}b.setAttribute('aria-label',ITEMS[x.id].n+(x.n>1?' ×'+x.n:''));}
   else b.setAttribute('aria-label','пусто');
   const lock=(k==='L'||k==='R')&&!x&&isTwo(hand(k==='L'?'R':'L'));if(lock){b.classList.add('lock');b.append(icon(document.createElement('canvas'),hand(k==='L'?'R':'L').id));}
   b.onpointerdown=e=>dragStart(e,k,i);return b;}
 function describe(k,i,el){const x=S(k)[i];if(el)el.textContent=x?ITEMS[x.id].n+(x.n>1?' ×'+x.n:'')+' — '+ITEMS[x.id].d:'';}
 function render(){for(const s of ['L','R']){const o=s==='L'?'R':'L',lock=!hand(s)&&isTwo(hand(o));
   const palm=document.getElementById('palm'+s),inv=document.getElementById('inv'+s);palm.classList.toggle('open',st.open===s);palm.style.opacity=lock?.8:1;
   const h=hand(s)||(lock?hand(o):null);const hc=document.getElementById('held'+s);icon(hc,h&&h.id);hc.classList.toggle('empty',!h);hc.dataset.n=h&&h.n>1?h.n:'';palm.classList.toggle('holding',!!h);
   inv.classList.toggle('open',st.open===s);if(st.open!==s)continue;inv.replaceChildren();
   const hd=document.createElement('h4');hd.innerHTML=(s==='L'?'Левая рука':'Правая рука')+'<small>перетащите или нажмите, чтобы переложить</small>';
   const top=document.createElement('div');top.className='handrow';const hs=slotEl(s,0);hs.classList.add('hand');top.append(hs);
   const lbl=document.createElement('span');lbl.className='hl';lbl.textContent='в руке';top.append(lbl);
   const g=document.createElement('div');g.className='grid';for(let i=0;i<BAG;i++)g.append(slotEl('bag',i));
   const nm=document.createElement('div');nm.className='name';if(sel)describe(sel.k,sel.i,nm);else nm.textContent='Сумка: '+C.bag.filter(Boolean).length+' из '+BAG;
   inv.append(hd,top,g,nm);}
   renderChest();}
 // ---------- tap or drag to move ----------
 let drag=null;
 function dragStart(e,k,i){e.stopPropagation();e.preventDefault();const x=S(k)[i];drag={k,i,x0:e.clientX,y0:e.clientY,moved:false,ghost:null,has:!!x};
   addEventListener('pointermove',dragMove);addEventListener('pointerup',dragEnd,{once:true});}
 function dragMove(e){if(!drag||!drag.has)return;if(!drag.moved&&Math.hypot(e.clientX-drag.x0,e.clientY-drag.y0)>8){drag.moved=true;const g=icon(document.createElement('canvas'),S(drag.k)[drag.i].id);g.className='ghost';document.body.append(g);drag.ghost=g;}
   if(drag.ghost){drag.ghost.style.left=e.clientX+'px';drag.ghost.style.top=e.clientY+'px';}}
 function dragEnd(e){removeEventListener('pointermove',dragMove);const d=drag;drag=null;if(!d)return;if(d.ghost)d.ghost.remove();
   if(d.moved){const t=document.elementFromPoint(e.clientX,e.clientY);const s=t&&t.closest('.slot');if(s){doMove(d.k,d.i,s.dataset.k,+s.dataset.i);}return;}
   // tap: select, then tap a second slot to move there
   if(sel&&!(sel.k===d.k&&sel.i===d.i)){const a=sel;sel=null;doMove(a.k,a.i,d.k,d.i);return;}
   sel=sel?null:(d.has?{k:d.k,i:d.i}:null);render();}
 async function doMove(ak,ai,bk,bi){sel=null;const before=JSON.stringify([hand('L'),hand('R')]);if(move(ak,ai,bk,bi)){window.sfx&&sfx(ak==='chest'&&bk!=='chest'?'pickup':'click');
     if(ak==='chest'||bk==='chest')saveChest();}render();
   if(JSON.stringify([hand('L'),hand('R')])!==before){sync();for(const s of ['L','R'])if(hand(s)&&st.open!==s)await animate(s,['open','half','grip']);await settle();}}
 async function toggle(s){st.open=st.open===s?null:s;sel=null;render();window.sfx&&sfx('click');
   if(st.open===s)await animate(s,['half','open']);await settle();}
 for(const s of ['L','R']){const p=document.getElementById('palm'+s);const t=e=>{e.stopPropagation();toggle(s);};p.onclick=t;p.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();t(e);}};
   document.getElementById('inv'+s).onpointerdown=e=>e.stopPropagation();setPose(s,'grip');}
 document.getElementById('stage').addEventListener('pointerdown',e=>{if(chestRef&&!e.target.closest('.chestui,.inv,.palm')){closeChest();e.stopPropagation();return;}if(st.open&&!e.target.closest('.inv,.palm')){st.open=null;sel=null;render();settle();}},true);

 // ---------- chest window ----------
 const chEl=document.getElementById('chestui');
 function renderChest(){if(!chestRef){chEl.hidden=true;return;}chEl.hidden=false;chEl.replaceChildren();
   const h=document.createElement('h4');h.textContent=chestRef.name;chEl.append(h);
   const cg=document.createElement('div');cg.className='grid chest';C.chest.forEach((_,i)=>cg.append(slotEl('chest',i)));chEl.append(cg);
   const h2=document.createElement('h5');h2.textContent='Ваши руки и сумка';chEl.append(h2);
   const row=document.createElement('div');row.className='carry';const l=slotEl('L',0),r=slotEl('R',0);l.classList.add('hand');r.classList.add('hand');
   const bg=document.createElement('div');bg.className='grid';for(let i=0;i<BAG;i++)bg.append(slotEl('bag',i));row.append(l,bg,r);chEl.append(row);
   const nm=document.createElement('div');nm.className='name';if(sel)describe(sel.k,sel.i,nm);else nm.textContent=C.chest.some(Boolean)?'Перетащите или нажмите на предмет, затем на ячейку.':'Сундук пуст.';chEl.append(nm);
   const bt=document.createElement('div');bt.className='btns';const all=document.createElement('button');all.textContent='Взять всё';all.disabled=!C.chest.some(Boolean);
   all.onclick=e=>{e.stopPropagation();takeAll();};const cl=document.createElement('button');cl.textContent='Закрыть';cl.onclick=e=>{e.stopPropagation();closeChest();};bt.append(all,cl);chEl.append(bt);}
 chEl.addEventListener('pointerdown',e=>e.stopPropagation());
 function saveChest(){if(chestRef)chestRef.items=C.chest.map(x=>x&&{id:x.id,n:x.n});}
 function takeAll(){const got=[];C.chest.forEach((x,i)=>{if(!x)return;const k=add(x.id,x.n);if(k){got.push([x.id,k]);x.n-=k;if(!x.n)C.chest[i]=null;}});saveChest();
   if(got.length){window.sfx&&sfx('pickup');flyIn(got);}if(C.chest.some(Boolean))say2('Не всё поместилось: сумка полна или достигнут предел.');render();sync();settle();}
 async function openChest(ref){chestRef=ref;C.chest=Array(Math.max(4,ref.items.length)).fill(null).map((_,i)=>ref.items[i]?{...ref.items[i]}:null);sel=null;st.open=null;render();
   document.body.classList.add('chest-open');for(const s of ['L','R'])animate(s,['half','open']);}
 function closeChest(){saveChest();if(chestRef&&chestRef.close)chestRef.close();chestRef=null;sel=null;document.body.classList.remove('chest-open');render();settle();}

 // ---------- "you got" card that flies into the hand ----------
 function flyIn(list,title='Получено'){const card=document.createElement('div');card.className='gotcard';const h=document.createElement('b');h.textContent=title;card.append(h);
   for(const [id,n] of list){const r=document.createElement('div');r.append(icon(document.createElement('canvas'),id));const t=document.createElement('span');t.textContent=ITEMS[id].n+(n>1?' ×'+n:'');r.append(t);card.append(r);}
   document.getElementById('stage').append(card);requestAnimationFrame(()=>card.classList.add('show'));
   setTimeout(()=>{const palm=document.getElementById('palmR').getBoundingClientRect(),c=card.getBoundingClientRect();card.style.transform='translate('+(palm.left+palm.width/2-c.left-c.width/2)+'px,'+(palm.top-c.top)+'px) scale(.2)';card.style.opacity='0';
     const p=document.getElementById('palmR');p.classList.remove('catch');void p.offsetWidth;p.classList.add('catch');animate('R',['open','half','grip']).then(settle);},1500);
   setTimeout(()=>card.remove(),2200);}
 // palm gestures for actions in the world
 async function gesture(type){const pl=document.getElementById('palmL'),pr=document.getElementById('palmR');
   if(type==='pickup'){pr.classList.add('grab');await animate('R',['half','open']);await wait(220);await animate('R',['half','grip']);pr.classList.remove('grab');await settle();}
   if(type==='inspect'){pr.classList.add('peek');await animate('R',['half']);await wait(900);pr.classList.remove('peek');await settle();}
   if(type==='chest'){pl.classList.add('reach');pr.classList.add('reach');await Promise.all([animate('L',['half','open']),animate('R',['half','open'])]);await wait(400);pl.classList.remove('reach');pr.classList.remove('reach');}}

 // ---------- API for the game ----------
 window.handsAdd=(id,n,quiet)=>{const k=add(id,n);render();sync();settle();if(k&&!quiet){window.sfx&&sfx('pickup');flyIn([[id,k]]);}if(k<n)say2(k?'Взято '+k+', больше не унести.':'Больше не унести: '+ITEMS[id].n+'.');return k;};
 window.handsGive=(list,title)=>{const got=[];for(const [id,n] of list){const k=add(id,n);if(k)got.push([id,k]);}render();sync();settle();if(got.length){window.sfx&&sfx('pickup');flyIn(got,title);}return got;};
 window.handsConsume=id=>{const ok=take1(id);render();sync();settle();return ok;};
 window.handsCount=id=>carried(id);
 window.handsIsOpen=()=>!!st.open;
 window.handsIconURL=id=>icon(document.createElement('canvas'),id).toDataURL();
 window.handsItems=()=>({L:hand('L'),R:hand('R'),bag:C.bag.map(x=>x&&{...x})});
 window.handsLoad=d=>{if(d.bag){C.L[0]=d.L;C.R[0]=d.R;C.bag=d.bag.slice(0,BAG).concat(Array(BAG).fill(null)).slice(0,BAG);}
   else{C.L[0]=d.L?{id:d.L,n:1}:null;C.R[0]=d.R?{id:d.R,n:1}:null;C.bag=Array(BAG).fill(null);for(const id of ['potion','bread','stone'])if(d[id])add(id,d[id]);}render();sync();settle();};
 window.handsOpenChest=openChest;window.handsGesture=gesture;window.handsFly=flyIn;window.handsItemName=id=>ITEMS[id].n;
 render();addEventListener('resize',()=>render());})();

</script>
